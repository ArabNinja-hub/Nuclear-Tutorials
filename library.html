<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library — Nuclear Tutorials</title>
<meta name="description" content="Browse lessons across all Nuclear Tutorials courses and see which are included with your access package.">
<link rel="icon" type="image/jpeg" href="assets/img/logo.jpg">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="library">

<main>
  <section class="page-head">
    <div class="container">
      <div class="crumbs"><a href="index.html">Home</a> <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg> Library</div>
      <div class="page-head-row">
        <div>
          <span class="eyebrow" style="margin-top:14px">Your learning</span>
          <h1>Lesson library</h1>
          <p class="lede">Browse every lesson across the catalogue and see what is included with your package.</p>
        </div>
        <a class="btn btn-secondary" href="dashboard.html">Go to dashboard</a>
      </div>
    </div>
  </section>

  <section class="section-body">
    <div class="container">
      <div class="lib-gate hidden" id="libGate">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span><b>Sign in to view your lessons.</b> Enter an access code to see which lessons are available with your package.</span>
        <a class="btn btn-secondary btn-sm" href="access.html">Sign in</a>
      </div>

      <div class="lib-toolbar">
        <div class="search">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="input" id="libSearch" type="search" placeholder="Search lessons" aria-label="Search lessons">
        </div>
        <div class="segmented" id="libStatus" role="group" aria-label="Filter lessons by availability"></div>
      </div>

      <div id="activeFilters" class="filter-row" aria-live="polite"></div>
      <p class="lib-summary" id="libSummary" aria-live="polite"></p>
      <div id="libRoot"></div>
    </div>
  </section>
</main>

<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>

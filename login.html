<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log In — Nuclear Tutorials</title>
<meta name="description" content="Log in to your Nuclear Tutorials learning space and continue where you left off.">
<link rel="icon" type="image/jpeg" href="assets/img/logo.jpg">
<link rel="stylesheet" href="assets/css/fonts.css?v=da690b1f">
<link rel="stylesheet" href="assets/css/main.css?v=9f268e1f">
</head>
<body data-page="login">
<main id="main" tabindex="-1">
  <section class="auth-page section-body">
    <div class="container auth-page-layout auth-page-login">
      <div class="auth-intro">
        <span class="eyebrow">Welcome back</span>
        <h1>Pick up where<br>you left off.</h1>
        <p class="lede">Log in to your account to return to your personalized learning space, courses and progress.</p>
        <a class="link-arrow auth-back-link" href="index.html">Back to Nuclear Tutorials <span aria-hidden="true">→</span></a>
      </div>
      <section class="card auth-card" aria-labelledby="loginTitle">
        <div class="auth-card-heading"><span class="eyebrow">Log in</span><h2 id="loginTitle">Continue your learning</h2><p>Enter your account details to continue.</p></div>
        <form id="loginForm" class="auth-form" novalidate>
          <div class="field"><label for="loginEmail">Email address</label><input class="input" id="loginEmail" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
          <div class="field"><label for="loginPassword">Password</label><input class="input" id="loginPassword" name="password" type="password" autocomplete="current-password" required></div>
          <div id="authMessage" aria-live="polite"></div>
          <button class="btn btn-primary btn-lg btn-block" type="submit">Log in</button>
        </form>
        <p class="auth-switch">New to Nuclear Tutorials? <a href="signup.html">Get Started</a></p>
      </section>
    </div>
  </section>
</main>
<script src="assets/js/icons.js?v=a791ff4f"></script>
<script src="assets/js/data.js?v=fd013727"></script>
<script src="assets/js/store.js?v=2cfd6470"></script>
<script src="assets/js/api.js?v=54082798"></script>
<script src="assets/js/ui.js?v=c1d82f97"></script>
<script src="assets/js/app.js?v=df36bc97"></script>
</body>
</html>

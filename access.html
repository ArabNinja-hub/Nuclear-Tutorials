<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redeem an Access Code — Nuclear Tutorials</title>
<meta name="description" content="Redeem a Nuclear Tutorials access code to unlock the lessons included in your package.">
<link rel="icon" type="image/jpeg" href="assets/img/logo.jpg">
<link rel="stylesheet" href="assets/css/fonts.css?v=da690b1f">
<link rel="stylesheet" href="assets/css/main.css?v=58625cd5">
</head>
<body data-page="access">
<main id="main" tabindex="-1">
  <section class="page-head">
    <div class="container">
      <div class="crumbs"><a href="dashboard.html">Dashboard</a> <span aria-hidden="true">›</span> Access
      </div>
      <span class="eyebrow">Access packages</span>
      <h1>Redeem an access code</h1>
      <p class="lede">Enter the code issued with your package. Your learner profile is already saved to your account.</p>
    </div>
  </section>
  <section class="section-body">
    <div class="container access-container">
      <div class="panel access-panel">
        <div id="currentAccess" class="access-current hidden" role="status"><div id="currentAccessBody"></div></div>
        <form id="codeForm" novalidate>
          <div class="field access-code-field">
            <label for="codeInput">Access code</label>
            <input class="input" id="codeInput" name="accessCode" type="text" inputmode="text" enterkeyhint="go" placeholder="Enter your access code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" aria-describedby="codeHelp" required>
            <span class="field-hint" id="codeHelp">Each access code can be redeemed once.</span>
          </div>
          <div id="codeMsg" class="access-message" role="alert" aria-live="polite"></div>
          <button class="btn btn-primary btn-lg btn-block" type="submit">Redeem code</button>
        </form>
        <div id="codeResult" class="hidden" role="status" aria-live="polite"></div>
        <p class="access-packages-link">Need a package? <a href="pricing.html">Compare Access Packages</a>.</p>
      </div>
    </div>
  </section>
</main>
<script src="assets/js/icons.js?v=a4212b2e"></script>
<script src="assets/js/data.js?v=fd013727"></script>
<script src="assets/js/store.js?v=2cfd6470"></script>
<script src="assets/js/api.js?v=54082798"></script>
<script src="assets/js/ui.js?v=adc3a414"></script>
<script src="assets/js/app.js?v=df36bc97"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login with an Access Code — Nuclear Tutorials</title>
<meta name="description" content="Choose High School or University, then enter your Nuclear Tutorials access code.">
<link rel="icon" type="image/jpeg" href="assets/img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="access">

<main>
  <section class="page-head">
    <div class="container">
      <div class="crumbs"><a href="index.html">Home</a> <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg> Login</div>
      <h1>Log in with your access code</h1>
      <p class="lede">Choose your education level, then enter your access code to continue.</p>
    </div>
  </section>

  <section class="section-body">
    <div class="container access-container">
      <div class="panel access-panel">
        <div id="currentAccess" class="access-current hidden" role="status">
          <div id="currentAccessBody"></div>
        </div>

        <form id="codeForm" novalidate>
          <fieldset class="level-choice-fieldset" aria-describedby="levelHelp">
            <legend>Choose your level</legend>
            <p class="field-hint" id="levelHelp">This sets your course view. You can change it later in your learning profile.</p>
            <div class="level-choice-grid">
              <label class="level-choice">
                <input type="radio" name="educationLevel" value="high-school" required>
                <span class="level-choice-card"><span class="level-choice-radio" aria-hidden="true"></span><span>High School</span></span>
              </label>
              <label class="level-choice">
                <input type="radio" name="educationLevel" value="university" required>
                <span class="level-choice-card"><span class="level-choice-radio" aria-hidden="true"></span><span>University</span></span>
              </label>
            </div>
          </fieldset>

          <div class="field access-code-field">
            <label for="codeInput">Access code</label>
            <input class="input" id="codeInput" name="accessCode" placeholder="Enter your access code" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="codeHelp" required>
            <span class="field-hint" id="codeHelp">Enter the code issued with your access package.</span>
          </div>
          <div id="codeMsg" class="access-message" role="alert" aria-live="polite"></div>
          <button class="btn btn-primary btn-lg btn-block" type="submit">Continue</button>
        </form>

        <div id="codeResult" class="hidden" role="status" aria-live="polite"></div>
        <p class="access-packages-link">Need a code? <a href="pricing.html">View access packages</a>.</p>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/video.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>

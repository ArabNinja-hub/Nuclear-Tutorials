<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courses — Nuclear Tutorials</title>
<meta name="description" content="Choose your learning path and browse structured high-school and university courses.">
<link rel="icon" type="image/jpeg" href="assets/img/logo.jpg">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="courses">

<main>
  <section class="discovery-head">
    <div class="container">
      <div class="crumbs"><a href="index.html">Home</a> <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg> Courses</div>
      <span class="eyebrow eyebrow-orbit" style="margin-top:14px">Course catalogue</span>
      <h1>Choose your learning path</h1>
      <p class="lede">Pick a pathway, open a course and see every lesson before you commit to anything.</p>
      <div class="discovery-toolbar">
        <div class="pathway-tabs" id="pathwayTabs" role="group" aria-label="Browse courses by pathway"></div>
        <div class="search search-field">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="input" id="courseSearch" type="search" placeholder="Search courses" aria-label="Search courses">
        </div>
      </div>
    </div>
  </section>

  <section class="section-body">
    <div class="container">
      <div class="course-results-head" id="courseResults" aria-live="polite"></div>
      <div id="activeFilters" class="filter-row hidden" aria-live="polite"></div>
      <div class="course-catalog-grid" id="courseList"></div>
    </div>
  </section>
</main>

<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>

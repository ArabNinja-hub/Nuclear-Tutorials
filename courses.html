<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

      <div class="course-catalog-grid" id="courseList"></div>
    </div>
  </section>
</main>

<script src="assets/js/icons.js"></script>

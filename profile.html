<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Profile — Nuclear Tutorials</title>
<meta name="description" content="Set the study level and subject used to pre-filter your Nuclear Tutorials course list.">
<link rel="icon" type="image/jpeg" href="assets/img/logo.jpg">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="profile">

<main>
  <section class="page-head">
    <div class="container">
      <div class="crumbs"><a href="index.html">Home</a> <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg> Profile</div>
      <h1>Your learning profile</h1>
      <p class="lede">Choose a study level and subject to pre-filter course browsing.</p>
    </div>
  </section>

  <section class="section-body">
    <div class="container profile-layout">
      <section class="card profile-form-card">
        <h2 class="profile-form-title">Study preferences</h2>
        <form id="profileForm" class="profile-form">
          <div class="field">
            <label for="profileName">Display name <span class="muted">(optional)</span></label>
            <input class="input" id="profileName" type="text" maxlength="60" placeholder="Your name" autocomplete="name">
          </div>
          <div class="field">
            <label for="profileEducationLevel">Education level</label>
            <select class="input" id="profileEducationLevel" required></select>
          </div>
          <div class="field">
            <label for="profileSubject">Subject of interest <span class="muted">(optional)</span></label>
            <select class="input" id="profileSubject"></select>
          </div>
          <div class="profile-form-actions">
            <button class="btn btn-primary" type="submit">Save preferences</button>
            <span id="profileSaveMessage" class="profile-save-message" aria-live="polite"></span>
          </div>
        </form>
        <p class="profile-note">Preferences are stored in this browser only.</p>
      </section>

      <aside class="card profile-summary-card">
        <h2>Selected preferences</h2>
        <div id="profileSummary" class="profile-summary"></div>
        <a class="btn btn-secondary btn-block" id="profileBrowseCourses" href="courses.html">Browse matching courses</a>
      </aside>
    </div>
  </section>
</main>

<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — Nuclear Tutorials</title>
<meta name="description" content="Search Nuclear Tutorials courses, subjects and lesson titles.">
<link rel="icon" type="image/jpeg" href="assets/img/logo.jpg">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="search">

<main>
  <section class="page-head">
    <div class="container">
      <div class="crumbs"><a href="index.html">Home</a> <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg> Search</div>
      <span class="eyebrow" style="margin-top:14px">Search</span>
      <h1>Search the catalogue</h1>
      <p class="lede">Search the listed courses, subjects and lesson titles.</p>
    </div>
  </section>

  <section class="section-body">
    <div class="container">
      <label class="search-global-field" for="globalSearchInput">
        <span class="sr-only">Search courses, subjects and lessons</span>
        <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="globalSearchInput" type="search" placeholder="Search courses, subjects or lessons" autocomplete="off" aria-controls="searchResults">
      </label>
      <div class="search-toolbar">
        <div class="search-tabs" role="group" aria-label="Filter search results">
          <button type="button" class="active" data-search-kind="all" aria-pressed="true">All</button>
          <button type="button" data-search-kind="courses" aria-pressed="false">Courses</button>
          <button type="button" data-search-kind="lessons" aria-pressed="false">Lessons</button>
        </div>
        <span class="search-summary" id="searchSummary" aria-live="polite"></span>
      </div>
      <div class="search-results" id="searchResults" aria-live="polite"></div>
    </div>
  </section>
</main>

<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>

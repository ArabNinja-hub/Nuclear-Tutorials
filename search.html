<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Search — Nuclear Tutorials</title>
<meta name="description" content="Search courses, subjects and lesson titles in your personalized Nuclear Tutorials catalogue.">
<link rel="icon" type="image/jpeg" href="assets/img/logo.jpg">
<link rel="stylesheet" href="assets/css/fonts.css?v=da690b1f">
<link rel="stylesheet" href="assets/css/main.css?v=276eff6f">
</head>
<body data-page="search">
<main id="main" tabindex="-1">
  <section class="page-head">
    <div class="container">
      <div class="crumbs"><a href="dashboard.html">Dashboard</a> <span aria-hidden="true">›</span> Search</div>
      <span class="eyebrow" style="margin-top:14px">Search your learning catalogue</span>
      <h1>Find your next lesson</h1>
      <p class="lede">Search courses, subjects, learning resources and lesson titles available for your profile.</p>
    </div>
  </section>
  <section class="section-body">
    <div class="container">
      <label class="search-global-field" for="globalSearchInput">
        <span class="sr-only">Search courses, subjects and lessons</span>
        <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="globalSearchInput" type="search" placeholder="Search courses, subjects or lessons" autocomplete="off" aria-controls="searchResults">
      </label>
      <div class="search-toolbar">
        <div class="search-tabs" role="group" aria-label="Filter search results">
          <button type="button" class="active" data-search-kind="all" aria-pressed="true">All</button>
          <button type="button" data-search-kind="universities" aria-pressed="false">Institutions</button>
          <button type="button" data-search-kind="courses" aria-pressed="false">Courses</button>
          <button type="button" data-search-kind="videos" aria-pressed="false">Lessons</button>
        </div>
        <span class="search-summary" id="searchSummary" aria-live="polite"></span>
      </div>
      <div class="search-results" id="searchResults" aria-live="polite"></div>
    </div>
  </section>
</main>
<script src="assets/js/icons.js?v=a4212b2e"></script>
<script src="assets/js/data.js?v=fd013727"></script>
<script src="assets/js/store.js?v=2cfd6470"></script>
<script src="assets/js/api.js?v=54082798"></script>
<script src="assets/js/ui.js?v=adc3a414"></script>
<script src="assets/js/app.js?v=df36bc97"></script>
</body>
</html>
